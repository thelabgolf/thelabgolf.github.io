<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Practice Center smoke checks</title><style>body{font:16px system-ui;background:#101710;color:#f3f8f3;max-width:800px;margin:30px auto;padding:20px}button{padding:12px;background:#baff39;border:0;border-radius:8px;font-weight:700}pre{white-space:pre-wrap}iframe{width:100%;height:280px;border:1px solid #456044}</style></head><body><h1>Practice Center regression checks</h1><p>Run on the same origin as practice.html. The test temporarily changes local practice data, then restores it.</p><button id="run">Run checks</button><pre id="results" role="status"></pre><iframe id="app" title="Practice Center test frame" src="../practice.html"></iframe><script>
const key='thelab-practice-v1',output=document.getElementById('results'),frame=document.getElementById('app');const wait=()=>new Promise((resolve,reject)=>{const timeout=setTimeout(()=>reject(Error('Practice Center iframe load timed out')),10000);frame.onload=()=>{clearTimeout(timeout);resolve()};frame.src='../practice.html?smoke='+Date.now()});const check=(condition,message)=>{if(!condition)throw Error(message);output.textContent+='PASS '+message+'\n'};
document.getElementById('run').onclick=async()=>{const original=localStorage.getItem(key);output.textContent='';try{await wait();let w=frame.contentWindow,d=w.document;check(d.querySelectorAll('#drills article').length===260,'260 drills render');const allButtons=[...d.querySelectorAll('#drills button[data-id]')];const uniqueIds=new Set(allButtons.map(b=>b.dataset.id));check(allButtons.length===260&&uniqueIds.size===260,'260 unique drill IDs');let missing=[];for(const button of allButtons){button.click();const id=button.dataset.id;const steps=d.querySelectorAll('#instructions li').length;const hasDiagram=!!d.querySelector('#diagram svg[role="img"][aria-label]');const hasCoach=d.querySelectorAll('#coaching article').length===3;const hasSafety=!!d.getElementById('sessionSafety').textContent.trim();const max=Number(d.getElementById('successes').max);if(steps<3||!hasDiagram||!hasCoach||!hasSafety||!Number.isInteger(max)||max<1)missing.push(id+':'+[steps,hasDiagram,hasCoach,hasSafety,max].join('/'));}check(missing.length===0,'All 260 drills show steps, diagrams, coaching, safety and score limits: '+missing.slice(0,5).join(', '));d.getElementById('difficulty').value='Advanced';d.getElementById('difficulty').dispatchEvent(new Event('change',{bubbles:true}));check(d.querySelectorAll('#drills article').length>0&&d.querySelectorAll('#drills article').length<260,'Difficulty filter narrows results');d.getElementById('difficulty').value='all';d.getElementById('difficulty').dispatchEvent(new Event('change',{bubbles:true}));d.getElementById('equipment').value='Putter';d.getElementById('equipment').dispatchEvent(new Event('change',{bubbles:true}));check(d.querySelectorAll('#drills article').length===35,'Putter equipment filter returns Putting drills');d.getElementById('equipment').value='all';d.getElementById('equipment').dispatchEvent(new Event('change',{bubbles:true}));d.getElementById('location').value='Putting green';d.getElementById('location').dispatchEvent(new Event('change',{bubbles:true}));check(d.querySelectorAll('#drills article').length>=35,'Putting green location filter works');d.getElementById('location').value='all';d.getElementById('location').dispatchEvent(new Event('change',{bubbles:true}));d.getElementById('search').value='Fairway corridor';d.getElementById('search').dispatchEvent(new Event('input',{bubbles:true}));check(d.querySelectorAll('#drills article').length===1,'Search filters drills');d.getElementById('search').value='';d.getElementById('search').dispatchEvent(new Event('input',{bubbles:true}));const focusOpener=d.querySelector('#drills button[data-id="driver-fairway"]');focusOpener.focus();focusOpener.click();check(d.activeElement===d.getElementById('sessionTitle'),'Opening a drill focuses its title');d.getElementById('cancel').click();check(d.activeElement===focusOpener,'Closing a drill restores keyboard focus');d.querySelector('#categories button[data-skill="Woods & hybrids"]').click();check(d.querySelectorAll('#drills article').length===20,'Woods and hybrids category shows 20 drills');d.querySelector('#categories button[data-skill="Mental game & routines"]').click();check(d.querySelectorAll('#drills article').length===20,'Mental Game category shows 20 drills');d.querySelector('#categories button[data-skill="Specialty shots"]').click();check(d.querySelectorAll('#drills article').length===20,'Specialty Shots category shows 20 drills');d.querySelector('#categories button[data-skill="Strategy"]').click();check(d.querySelectorAll('#drills article').length===25,'Strategy category shows 25 drills');d.querySelector('#categories button[data-skill="Bunker play"]').click();check(d.querySelectorAll('#drills article').length===20,'Bunker category shows 20 drills');d.querySelector('#categories button[data-skill="Putting"]').click();check(d.querySelectorAll('#drills article').length===35,'Putting category shows 35 drills');d.querySelector('#categories button[data-skill="Chipping"]').click();check(d.querySelectorAll('#drills article').length===30,'Chipping category shows 30 drills');d.querySelector('#categories button[data-skill="Pitching & wedges"]').click();check(d.querySelectorAll('#drills article').length===25,'Pitching category shows 25 drills');d.querySelector('#categories button[data-skill="Driving"]').click();check(d.querySelectorAll('#drills article').length===30,'Driver category shows 30 drills');d.querySelector('#categories button[data-skill="Iron contact"]').click();check(d.querySelectorAll('#drills article').length===35,'Iron category shows 35 drills');for(const n of [11,12,24,27,28,30]){d.querySelector('#drills button[data-id="iron-expanded-'+n+'"]').click();check(d.getElementById('attemptsLabel').textContent.includes('9 attempts'),'Iron '+n+' uses nine scored attempts');}d.querySelector('#categories button[data-skill="Driving"]').click();d.querySelector('#drills button[data-id="driver-expanded-15"]').click();check(d.getElementById('attemptsLabel').textContent.includes('9 attempts'),'Nine-ball test scores nine attempts');d.getElementById('successes').value='';d.getElementById('save').click();check(d.getElementById('feedback').textContent.includes('Enter a whole number'),'Blank score rejected');d.getElementById('successes').value='10';d.getElementById('save').click();check(d.getElementById('feedback').textContent.includes('between 0 and 9'),'Over-limit score rejected');d.getElementById('successes').value='7';d.getElementById('save').click();check(d.getElementById('feedback').textContent.includes('Saved'),'Saving a practice result succeeds');const saved=JSON.parse(localStorage.getItem(key));check(saved[0].id==='driver-expanded-15'&&saved[0].attempts===9&&saved[0].successes===7,'Stored result contains correct score');await wait();w=frame.contentWindow;d=w.document;check(d.getElementById('sessions').textContent===String(saved.length),'Reload restores session count');check(d.getElementById('history').textContent.includes('Nine-ball fairway test'),'Reload restores history');d.getElementById('status').value='practiced';d.getElementById('status').dispatchEvent(new Event('change',{bubbles:true}));check(d.querySelectorAll('#drills article').length>=1,'Practiced filter reflects saved result');d.getElementById('status').value='all';d.getElementById('status').dispatchEvent(new Event('change',{bubbles:true}));const oldBlob=w.Blob;let exportPayload;w.Blob=function(parts,opts){exportPayload=JSON.parse(parts.join(''));return new oldBlob(parts,opts)};d.getElementById('export').click();check(exportPayload.type==='practice-results'&&exportPayload.history[0].attempts===9,'JSON export includes saved history');output.textContent+='ALL BROWSER CHECKS PASSED\n'}catch(e){output.textContent+='FAIL '+e.message+'\n'}finally{if(original===null)localStorage.removeItem(key);else localStorage.setItem(key,original);await wait();output.textContent+='Original local data restored.\n'}};
</script></body></html>
