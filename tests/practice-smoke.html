<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Practice Center smoke checks</title><style>body{font:16px system-ui;background:#101710;color:#f3f8f3;max-width:800px;margin:30px auto;padding:20px}button{padding:12px;background:#baff39;border:0;border-radius:8px;font-weight:700}pre{white-space:pre-wrap}iframe{width:100%;height:280px;border:1px solid #456044}</style></head><body><h1>Practice Center regression checks</h1><p>Run on the same origin as practice.html. The test temporarily changes local practice data, then restores it.</p><button id="run">Run checks</button><pre id="results" role="status"></pre><iframe id="app" title="Practice Center test frame" src="../practice.html"></iframe><script>
const key='thelab-practice-v1',output=document.getElementById('results'),frame=document.getElementById('app');const wait=()=>new Promise((resolve,reject)=>{const timeout=setTimeout(()=>reject(Error('Practice Center iframe load timed out')),10000);frame.onload=()=>{clearTimeout(timeout);resolve()};frame.src='../practice.html?smoke='+Date.now()});const check=(condition,message)=>{if(!condition)throw Error(message);output.textContent+='PASS '+message+'\n'};
document.getElementById('run').onclick=async()=>{const original=localStorage.getItem(key);output.textContent='';try{await wait();let w=frame.contentWindow,d=w.document;check(d.querySelectorAll('#drills article').length===37,'37 drills render');d.getElementById('search').value='Fairway corridor';d.getElementById('search').dispatchEvent(new Event('input',{bubbles:true}));check(d.querySelectorAll('#drills article').length===1,'Search filters drills');d.getElementById('search').value='';d.getElementById('search').dispatchEvent(new Event('input',{bubbles:true}));d.querySelector('#categories button[data-skill="Driving"]').click();check(d.querySelectorAll('#drills article').length===30,'Driver category shows 30 drills');d.querySelector('#drills button[data-id="driver-expanded-15"]').click();check(d.getElementById('attemptsLabel').textContent.includes('9 attempts'),'Nine-ball test scores nine attempts');d.getElementById('successes').value='';d.getElementById('save').click();check(d.getElementById('feedback').textContent.includes('Enter a whole number'),'Blank score rejected');d.getElementById('successes').value='10';d.getElementById('save').click();check(d.getElementById('feedback').textContent.includes('between 0 and 9'),'Over-limit score rejected');d.getElementById('successes').value='7';d.getElementById('save').click();check(d.getElementById('feedback').textContent.includes('Saved'),'Saving a practice result succeeds');const saved=JSON.parse(localStorage.getItem(key));check(saved[0].id==='driver-expanded-15'&&saved[0].attempts===9&&saved[0].successes===7,'Stored result contains correct score');await wait();w=frame.contentWindow;d=w.document;check(d.getElementById('sessions').textContent===String(saved.length),'Reload restores session count');check(d.getElementById('history').textContent.includes('Nine-ball fairway test'),'Reload restores history');d.getElementById('status').value='practiced';d.getElementById('status').dispatchEvent(new Event('change',{bubbles:true}));check(d.querySelectorAll('#drills article').length>=1,'Practiced filter reflects saved result');d.getElementById('status').value='all';d.getElementById('status').dispatchEvent(new Event('change',{bubbles:true}));const oldBlob=w.Blob;let exportPayload;w.Blob=function(parts,opts){exportPayload=JSON.parse(parts.join(''));return new oldBlob(parts,opts)};d.getElementById('export').click();check(exportPayload.type==='practice-results'&&exportPayload.history[0].attempts===9,'JSON export includes saved history');output.textContent+='ALL BROWSER CHECKS PASSED\n'}catch(e){output.textContent+='FAIL '+e.message+'\n'}finally{if(original===null)localStorage.removeItem(key);else localStorage.setItem(key,original);await wait();output.textContent+='Original local data restored.\n'}};
</script></body></html>
