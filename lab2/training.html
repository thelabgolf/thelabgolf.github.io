<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101214"><title>Guided Training | The Lab</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101214;color:#f5f6f4}main{max-width:680px;margin:auto;padding:24px 18px 100px}a{color:#c7f43b}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:32px}header strong,.eyebrow{color:#c7f43b;letter-spacing:.06em}h1{font-size:clamp(29px,8vw,42px);margin:12px 0}h2{font-size:21px}p,li{line-height:1.6;color:#cbd5cc}.panel{background:#1c2420;border:1px solid #405347;border-radius:18px;padding:20px;margin:16px 0}.panel h2{color:#c7f43b;margin:0 0 10px}.panel ol{padding-left:22px}li{margin:12px 0}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;border:0;border-radius:12px;background:#c7f43b;color:#101214;padding:13px 18px;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none}.btn.secondary{background:#303b33;color:#f4f5f2;border:1px solid #526053}.full{width:100%}label{display:block;font-weight:700;margin:14px 0}input,textarea,select{display:block;width:100%;margin-top:7px;padding:13px;border-radius:10px;background:#111713;border:1px solid #607267;color:#fff;font:inherit;font-size:17px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.muted{color:#aab8ad}.status{min-height:25px;color:#c7f43b}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #c7f43b;outline-offset:3px}</style></head><body><main><header><a href="./programs.html">← My Programs</a><strong>THE LAB / TRAIN</strong></header><div id="content"><h1>Loading your workout…</h1><p>Checking saved programs.</p></div></main><script type="module">
import {supabase} from './src/supabase.js';
const root=document.getElementById('content'),key='thelab-programs-v1',params=new URLSearchParams(location.search),id=params.get('program');
const names=['Driver accuracy','Fix driver slice','Iron contact','Fairway woods','Chipping','Pitching','Putting','Bunkers','Course strategy','Fitness','Mental game'];
const drills=[
['Fairway Finder','Choose a safe target corridor about 30 yards wide at your driver landing distance.',['Warm up with eight comfortable swings.','Hit 15 drives using your pre-shot routine.','Count balls finishing within the corridor.'],15,60,'A ball finishes in your target corridor.','If misses are mainly right, check face alignment and start direction.'],
['Driver Start-Line Control','Choose a clear start-line marker and a safe landing area.',['Hit five easy warm-up drives and observe starting direction.','Hit 10 controlled drives toward your chosen start line.','Count shots starting on line and staying in a playable corridor.'],10,60,'Starts near your intended line and remains playable.','If most shots start right, check the clubface at address.'],
['Ball-First Iron Contact','Use a mid-iron and a safe reference line on a mat or practice turf.',['Rehearse brushing the surface on the target side of the line eight times.','Hit 15 controlled mid-iron shots.','Count solid strikes without heavy or topped contact.'],15,65,'A solid strike without a heavy or topped shot.','If you hit behind the ball, rehearse a forward low point with half swings.'],
['Fairway Wood Contact','Use a level lie; begin from a low tee if necessary.',['Make six balanced rehearsal swings.','Hit 12 shots at comfortable speed.','Count solid strikes starting within your target corridor.'],12,60,'Solid, playable contact.','If you struggle from turf, practice first from a low tee.'],
['Landing-Spot Chips','Place a towel or safe landing marker on a practice green.',['Rehearse five short strokes.','Hit 15 chips toward the same landing spot.','Count first bounces in your marked landing area.'],15,60,'First bounce lands within the chosen zone.','Keep your landing spot fixed and adjust stroke length.'],
['Wedge Distance Ladder','Choose three safe wedge carry distances suited to your ability.',['Warm up with three wedges.','Hit 15 shots alternating among three distances.','Count carries finishing within five yards of the intended target.'],15,60,'Carry finishes within five yards of your target.','Rehearse consistent swing lengths and tempo.'],
['Putting Gate','Place two tees slightly wider than your putter head.',['Rehearse five smooth strokes through the gate.','Roll 20 putts toward a target six feet away.','Count balls passing cleanly through the gate.'],20,70,'Ball passes through the gate without touching the tees.','Check face alignment and shorten the stroke if needed.'],
['Bunker Escape','Practice in a designated bunker with a safe target.',['Rehearse entering sand just after a reference line six times.','Hit 12 greenside bunker shots.','Count shots escaping and finishing on the green; rake afterward.'],12,60,'Ball escapes and finishes on the green.','Practice a consistent sand entry point.'],
['Smart Target Decisions','Choose five holes and identify hazards and safe landing areas.',['For each hole identify the largest safe target.','Select a club using your normal carry distances.','Score five decisions based on choosing a defensible target.'],5,80,'A safe target and club are selected using realistic carry.','Favor a larger landing area over an unnecessarily risky line.'],
['Golf Mobility','Use a clear floor area and stop if movement causes pain.',['Perform five minutes of gentle mobility.','Do eight controlled balance repetitions on each side.','Finish with five minutes of comfortable stretching.'],16,80,'Controlled repetition without losing balance.','Reduce movement range if you cannot maintain control.'],
['Pre-Shot Routine','Choose a safe practice target and one repeatable routine.',['Rehearse your routine five times.','Hit 10 shots using the same routine each time.','Count complete routines regardless of ball flight.'],10,80,'Your full routine is completed before the shot.','Simplify to target, rehearsal, alignment, swing.']
];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let programs=[],plan=null,session=null,index=-1,owner=null;
function local(){try{const x=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(x)?x:[]}catch{return []}}
function pick(){plan=programs.find(p=>String(p.id)===id);if(!plan)return false;const sessions=plan.weeklySessions||plan.plan?.flatMap(w=>w.sessions||[])||[];index=sessions.findIndex(s=>!s.done&&!s.completed);if(index<0)index=sessions.length?0:-1;session=sessions[index];return !!session}
function showError(msg){root.innerHTML='<h1>Workout unavailable</h1><p>'+esc(msg)+'</p><a class="btn" href="./programs.html">Back to My Programs</a>'}
function render(){if(!pick()){showError('This program has no available training sessions. Open My Programs to select another plan.');return}
const skill=Number.isInteger(session.skillIndex)?session.skillIndex:Number.isInteger(session.skill)?session.skill:Math.max(0,names.indexOf(session.skill));const d=drills[Math.max(0,Math.min(10,skill))],week=session.week||Math.floor(index/Math.max(1,plan.frequency))+1;root.innerHTML='<p class="eyebrow">'+esc(plan.name)+' · Week '+week+' · Session '+(index+1)+'</p><h1>'+esc(d[0])+'</h1><p>'+esc(session.weekday||'Flexible day')+' · Guided workout · approximately 30–45 minutes</p><section class="panel"><h2>1 · Set up</h2><p>'+esc(d[1])+'</p></section><section class="panel"><h2>2 · Train</h2><ol>'+d[2].map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol><p><strong>What counts:</strong> '+esc(d[5])+'</p></section><section class="panel"><h2>3 · Record results</h2><p>Suggested test: '+d[3]+' attempts. Initial benchmark: '+d[4]+'%. These are practice targets, not clinically validated standards.</p><div class="cols"><label>Attempts<input id="attempts" type="number" min="1" max="500" inputmode="numeric" value="'+esc(session.attempts??d[3])+'"></label><label>Successful<input id="successes" type="number" min="0" max="500" inputmode="numeric" value="'+esc(session.successes??'')+'"></label></div><p id="score" class="status"></p><label>Most common miss<select id="miss"><option value="">Choose (optional)</option>'+['Left','Right','Short','Long','Thin','Heavy','Inconsistent','None'].map(x=>'<option '+(session.miss===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Notes<textarea id="notes" maxlength="500" rows="3" placeholder="What worked?">'+esc(session.notes||'')+'</textarea></label><p><strong>Next adjustment:</strong> '+esc(d[6])+'</p><button id="save" class="btn full" type="button">Save workout & mark complete</button><p id="message" class="status" role="status"></p></section>';
const update=()=>{const a=Number(document.getElementById('attempts').value),s=Number(document.getElementById('successes').value);document.getElementById('score').textContent=a>0&&s>=0&&s<=a&&document.getElementById('successes').value!==''?Math.round(s/a*100)+'% success · '+(s/a*100>=d[4]?'Benchmark reached':'Keep practicing'):'Enter your successful attempts.'};document.getElementById('attempts').oninput=update;document.getElementById('successes').oninput=update;update();document.getElementById('save').onclick=async()=>{const a=Number(document.getElementById('attempts').value),s=Number(document.getElementById('successes').value),msg=document.getElementById('message');if(!Number.isInteger(a)||a<1||a>500||!Number.isInteger(s)||s<0||s>a||document.getElementById('successes').value===''){msg.textContent='Enter valid attempts and successes before saving.';return}session.attempts=a;session.successes=s;session.done=true;session.completedAt=new Date().toISOString();session.miss=document.getElementById('miss').value;session.notes=document.getElementById('notes').value.slice(0,500);plan.completed=(plan.weeklySessions||[]).filter(x=>x.done||x.completed).length;const now=new Date(),day=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');const entry={id:'guided-'+plan.id+'-'+index+'-'+Date.now(),title:(session.skill||d[0])+' — '+d[0],date:day,attempts:a,successes:s,timestamp:session.completedAt};try{localStorage.setItem(key,JSON.stringify(programs));const old=JSON.parse(localStorage.getItem('thelab-practice-v1')||'[]');localStorage.setItem('thelab-practice-v1',JSON.stringify([entry,...(Array.isArray(old)?old:[])].slice(0,500)))}catch(e){msg.textContent='Could not save on this device: '+e.message;return}msg.textContent='Saved on this device. Syncing to your account…';if(supabase&&owner){const result=await Promise.allSettled([supabase.from('golfer_programs').upsert({user_id:owner,programs,updated_at:new Date().toISOString()},{onConflict:'user_id'}),supabase.from('practice_sessions').insert({user_id:owner,drill_id:entry.id,drill_title:entry.title,practiced_on:day,attempts:a,successes:s,created_at:entry.timestamp})]);if(result.some(x=>x.status==='rejected'||x.value?.error))msg.textContent='Saved on this device. Cloud sync needs retry.';else msg.textContent='Workout saved to your account.'}else msg.textContent='Saved on this device.';const link=document.createElement('a');link.className='btn full';link.href='./programs.html';link.textContent='Return to My Programs';msg.after(link);document.getElementById('save').disabled=true;};}
async function init(){if(!id){showError('No program was selected.');return}programs=local();if(supabase){try{const {data:{user}}=await supabase.auth.getUser();if(user){owner=user.id;const {data,error}=await supabase.from('golfer_programs').select('programs').eq('user_id',owner).maybeSingle();if(!error&&Array.isArray(data?.programs)){const remote=data.programs;if(remote.some(p=>String(p.id)===id)||!programs.some(p=>String(p.id)===id))programs=remote;}}}catch(e){console.warn('Using saved local programs',e)}}render()}init();
</script></body></html>
