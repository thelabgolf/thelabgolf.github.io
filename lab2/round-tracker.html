<!doctype html><html lang="en"><head><script>if(location.hostname==="the-lab-2-preview.vercel.app"){location.replace("https://thelabgolf.vercel.app"+location.pathname+location.search+location.hash)}</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Round Tracker | The Lab Golf</title><link rel="stylesheet" href="./assets/lab-design.css"><link rel="stylesheet" href="./assets/lab-responsive-audit.css"><style>body{margin:0;background:#101214;color:#f5f6f2;font:16px/1.5 system-ui}*{box-sizing:border-box}a{color:#c7f43b}.top{max-width:1050px;margin:auto;padding:20px 24px}.top a{text-decoration:none;font-weight:800}main{max-width:1050px;margin:auto;padding:35px 24px 100px}.eyebrow{color:#c7f43b;font-size:12px;font-weight:800;letter-spacing:.15em}h1{font-size:clamp(38px,6vw,60px);letter-spacing:-.05em;margin:12px 0}p{color:#bec9c6}form{background:#252b2d;border:1px solid #475052;border-radius:20px;padding:24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:25px 0 38px}label{display:grid;gap:7px;font-size:13px;font-weight:700}input,select,textarea{width:100%;border:1px solid #5a6365;background:#171c1e;color:white;border-radius:10px;padding:12px;font:inherit}textarea{min-height:110px;resize:vertical}.wide{grid-column:1/-1}button{background:#c7f43b;border:0;color:#111;font-weight:800;border-radius:10px;padding:12px 18px;cursor:pointer}button:disabled{opacity:.5}.entry{display:flex;justify-content:space-between;gap:20px;padding:22px;background:#242a2c;border:1px solid #434b4e;border-radius:15px;margin:12px 0}.entry h3{margin:5px 0}.entry p{margin:0}.entry small{color:#c7f43b}.entry button{align-self:center;background:#343b3d;color:#f5f5f5;border:1px solid #606a6d}#tool-status{min-height:25px}@media(max-width:600px){form{grid-template-columns:1fr}.entry{flex-direction:column}.entry button{align-self:flex-start}}</style><style id="lab-site-audit-2026">

</style></head><body data-tool="round"><header class="top"><a href="./account.html">← MY GOLF LAB</a><a href="./index.html" aria-label="The Lab Golf home"><img src="./327826cb-f4ad-42a0-9422-3d88d56b6c20.png" alt="The Lab Golf" style="display:block;width:112px;height:auto;margin-top:12px;object-fit:contain"></a></header><main><div class="eyebrow">THE LAB / PERSONAL TRAINING</div><h1>Round Tracker</h1><p>Record your rounds and identify the areas that cost you strokes.</p><p id="loading">Checking your account…</p><p id="tool-status" role="status" aria-live="polite"></p><form id="entry-form" hidden><label>Date<input type="date" name="played_on" required></label><label>Course<input name="course" maxlength="120" placeholder="Course name" required></label><label>Holes<select name="holes"><option value="18">18</option><option value="9">9</option></select></label><label>Total strokes<input type="number" name="score" min="18" max="200" required></label><label>Fairways hit<input type="number" name="fairways_hit" min="0" max="18"></label><label>Greens in regulation<input type="number" name="greens_hit" min="0" max="18"></label><label>Total putts<input type="number" name="putts" min="0" max="90"></label><label>Penalty strokes<input type="number" name="penalties" min="0" max="50"></label><label class="wide">Round notes<textarea name="notes" maxlength="2000" placeholder="What went well? What needs work?"></textarea></label><button class="wide" type="submit">Save to my account</button></form><h2>My history</h2><div id="entries"></div></main><script type="module" src="./src/personal-tools.js"></script></body></html>
