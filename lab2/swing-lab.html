<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Swing Lab | The Lab Golf</title><style>body{margin:0;background:#101214;color:#f5f6f2;font:16px/1.5 system-ui}*{box-sizing:border-box}a{color:#c7f43b}.top{max-width:1050px;margin:auto;padding:20px 24px}.top a{text-decoration:none;font-weight:800}main{max-width:1050px;margin:auto;padding:35px 24px 100px}.eyebrow{color:#c7f43b;font-size:12px;font-weight:800;letter-spacing:.15em}h1{font-size:clamp(38px,6vw,60px);letter-spacing:-.05em;margin:12px 0}p{color:#bec9c6}form{background:#252b2d;border:1px solid #475052;border-radius:20px;padding:24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:25px 0 38px}label{display:grid;gap:7px;font-size:13px;font-weight:700}input,select,textarea{width:100%;border:1px solid #5a6365;background:#171c1e;color:white;border-radius:10px;padding:12px;font:inherit}textarea{min-height:110px;resize:vertical}.wide{grid-column:1/-1}button{background:#c7f43b;border:0;color:#111;font-weight:800;border-radius:10px;padding:12px 18px;cursor:pointer}button:disabled{opacity:.5}.entry{display:flex;justify-content:space-between;gap:20px;padding:22px;background:#242a2c;border:1px solid #434b4e;border-radius:15px;margin:12px 0}.entry h3{margin:5px 0}.entry p{margin:0}.entry small{color:#c7f43b}.entry button{align-self:center;background:#343b3d;color:#f5f5f5;border:1px solid #606a6d}#tool-status{min-height:25px}@media(max-width:600px){form{grid-template-columns:1fr}.entry{flex-direction:column}.entry button{align-self:flex-start}}</style></head><body data-tool="swing"><header class="top"><a href="./account.html">← MY GOLF LAB</a></header><main><div class="eyebrow">THE LAB / PERSONAL TRAINING</div><h1>Swing Lab</h1><p>Build a personal history of your swing patterns, practice notes and improvements.</p><p id="loading">Checking your account…</p><p id="tool-status" role="status" aria-live="polite"></p><for
