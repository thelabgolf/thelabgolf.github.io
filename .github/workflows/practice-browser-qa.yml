name: Practice Center browser QA
on:
  push:
    branches: [main]
    paths:
      - practice.html
      - tests/practice-smoke.html
      - tests/run_browser_qa.py
      - .github/workflows/practice-browser-qa.yml
  workflow_dispatch:
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser automation
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run Practice Center browser QA
        run: python tests/run_browser_qa.py
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practice-browser-screenshots
          path: tests/practice-*.png
          if-no-files-found: ignore
