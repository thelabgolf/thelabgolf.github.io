name: Lab 2 free preview

on:
  push:
    branches: [lab-2-mobile-first]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lab2-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: lab2/package-lock.json
      - name: Install dependencies
        working-directory: lab2
        run: npm ci
      - name: Build Lab 2
        working-directory: lab2
        run: npm run build
      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: lab2/dist
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
